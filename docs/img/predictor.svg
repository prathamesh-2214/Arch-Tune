<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522"><rect x="1" y="1" width="958" height="520" rx="16" fill="#ffffff" stroke="#e3e5e8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a909a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker></defs><text x="40" y="46" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#16181d" font-weight="700" text-anchor="start">What the predictor computes (before any compilation)</text><rect x="40" y="92" width="250" height="88" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/><text x="54" y="124.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">Config knobs</text><text x="54" y="141.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">BLOCK_M, BLOCK_N, BLOCK_K</text><text x="54" y="159.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">num_warps, num_stages</text><line x1="292" y1="136" x2="366" y2="255" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="204" width="250" height="88" rx="12" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/><text x="54" y="244.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">Problem shape</text><text x="54" y="262.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">M x N x K of the matmul</text><line x1="292" y1="248" x2="366" y2="255" st