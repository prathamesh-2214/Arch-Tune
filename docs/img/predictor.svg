e UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="start">stages x tile buffers</text><line x1="592" y1="255" x2="666" y2="110" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="670" y="146" width="250" height="52" rx="12" fill="#fdecec" stroke="#e34948" stroke-width="2"/><text x="684" y="168.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="start">Registers / thread</text><text x="684" y="185.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="start">accumulators + operands</text><line x1="592" y1="255" x2="666" y2="172" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="670" y="208" width="250" height="52" rx="12" fill="#fdecec" stroke="#e34948" stroke-width="2"/><text x="684" y="230.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="start">Will it spill?</text><text x="684" y="247.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="start">estimate vs learned threshold</text><line x1="592" y1="255" x2="666" y2="234" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="670" y="270" width="250" height="52" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/><text x="684" y="292.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="start">Occupancy</text><text x="684" y="309.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="start">blocks per SM (CUDA rules)</text><line x1="592" y1="255" x2="666" y2="296" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="670" y="332" width="25