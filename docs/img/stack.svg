<svg xmlns="http://www.w3.org/2000/svg" width="960" height="676" viewBox="0 0 960 676"><rect x="1" y="1" width="958" height="674" rx="16" fill="#ffffff" stroke="#e3e5e8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a909a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker></defs><text x="40" y="46" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#16181d" font-weight="700" text-anchor="start">Where ArchTune sits in the torch.compile stack</text><text x="40" y="72" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4a4f59" font-weight="400" text-anchor="start">Every candidate kernel config goes down this whole stack before autotuning can time it.</text><rect x="40" y="100" width="560" height="60" rx="12" fill="#f4f5f7" stroke="#b9bfc8" stroke-width="2"/><text x="54" y="126.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">PyTorch model</text><text x="54" y="144.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">your nn.Module / functions</text><rect x="40" y="176" width="560" height="60" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/><text x="54" y="202.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">TorchDynamo</text><text x="54" y="220.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">captures the Python program as an FX graph</text><line x1="320.0" y1="162" x2="320.0" y2="173" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="252" width="560" height="60" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/><text x="54" y="278.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">TorchInductor</text><text x="54" y="296.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">fuses ops and generates Triton kernels (GEMM templates)</text><line x1="320.0" y1="238" x2="320.0" y2="249" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="328" width="560" height="60" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="2"/><text x="54" y="354.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">Autotuning  (max-autotune / triton.autotune)</text><text x="54" y="372.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">compile + benchmark every config, keep the fastest</text><line x1="320.0" y1="314" x2="320.0" y2="325" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="404" width="560" height="60" rx="12" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/><text x="54" y="430.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">Triton compiler</text><text x="54" y="448.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">TTIR  &gt;  TTGIR (layouts, pipelining)  &gt;  LLVM IR  &gt;  PTX</text><line x1="320.0" y1="390" x2="320.0" y2="401" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="480" width="560" height="60" rx="12" fill="#fdecec" stroke="#e34948" stroke-width="2"/><text x="54" y="506.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">ptxas  (NVIDIA PTX compiler)</text><text x="54" y="524.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">register allocation, scheduling, spills  &gt;  SASS</text><line x1="320.0" y1="466" x2="320.0" y2="477" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="556" width="560" height="60" rx="12" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/><text x="54" y="582.75" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="start">GPU</text><text x="54" y="600.25" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="start">driver loads the cubin, checks resources, runs on the SMs</text><line x1="320.0" y1="542" x2="320.0" y2="553" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="294" width="270" height="128" rx="12" fill="#eef7dd" stroke="#76b900" stroke-width="3"/><text x="795.0" y="328.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">ArchTune</text><text x="795.0" y="346.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="middle">predicts registers, spills,</text><text x="795.0" y="363.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="middle">shared memory, occupancy</text><text x="795.0" y="381.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="middle">BEFORE compiling; prunes</text><text x="795.0" y="398.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#4a4f59" font-weight="400" text-anchor="middle">doomed configs</text><line x1="660" y1="358.0" x2="606" y2="358.0" stroke="#76b900" stroke-width="3" marker-end="url(#ahg)"/><path d="M 795 422 L 795 510.0 L 606 510.0" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#ahg)" stroke-dasharray="6 4"/><text x="805" y="470.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4f7f00" font-weight="600" text-anchor="start">predicts what</text><text x="805" y="488.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4f7f00" font-weight="600" text-anchor="start">ptxas will do</text><text x="40" y="656" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4a4f59" font-weight="400" text-anchor="start" font-style="italic">Expensive per config: Triton lowering + ptxas run once for every candidate.</text></svg>