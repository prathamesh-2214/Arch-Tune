<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392"><rect x="1" y="1" width="958" height="390" rx="16" fill="#ffffff" stroke="#e3e5e8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a909a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker></defs><text x="40" y="46" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#16181d" font-weight="700" text-anchor="start">What autotuning is choosing, and what each choice costs</text><rect x="40" y="76" width="168" height="296" rx="14" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/><rect x="40" y="76" width="168" height="56" rx="14" fill="#2a78d6"/><rect x="40" y="116" width="168" height="16" fill="#2a78d6"/><text x="124.0" y="102" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Tile size</text><text x="124.0" y="122" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">BLOCK_M x BLOCK_N</text><text x="52" y="160" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="start">GAIN</text><text x="52" y="180" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">bigger tile = more data</text><text x="52" y="198" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">reuse, fewer DRAM reads</text><text x="52" y="252" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="start">COST</text><text x="52" y="272" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">more registers and</text><text x="52" y="290" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">shared memory; idle</text><text x="52" y="308" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">SMs on small shapes</text><rect x="223" y="76" width="168" height="296" rx="14" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/><rect x="223" y="76" width="168" height="56" rx="14" fill="#4a3aa7"/><rect x="223" y="116" width="168" height="16" fill="#4a3aa7"/><text x="307.0" y="102" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">K step</text><text x="307.0" y="122" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">BLOCK_K</text><text x="235" y="160" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4a3aa7" font-weight="700" text-anchor="start">GAIN</text><text x="235" y="180" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">fewer loop</text><text x="235" y="198" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">iterations</text><text x="235" y="252" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4a3aa7" font-weight="700" text-anchor="start">COST</text><text x="235" y="272" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">more operand</text><text x="235" y="290" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">registers and shared</text><text x="235" y="308" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">memory per stage</text><rect x="406" y="76" width="168" height="296" rx="14" fill="#fdeee7" stroke="#eb6834" stroke-width="2"/><rect x="406" y="76" width="168" height="56" rx="14" fill="#eb6834"/><rect x="406" y="116" width="168" height="16" fill="#eb6834"/><text x="490.0" y="102" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Warps</text><text x="490.0" y="122" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">num_warps</text><text x="418" y="160" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start">GAIN</text><text x="418" y="180" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">more threads share</text><text x="418" y="198" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">the tile, fewer</text><text x="418" y="216" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">registers each</text><text x="418" y="252" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#eb6834" font-weight="700" text-anchor="start">COST</text><text x="418" y="272" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">more synchronization;</text><text x="418" y="290" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">too few warps cannot</text><text x="418" y="308" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">hide latency</text><rect x="589" y="76" width="168" height="296" rx="14" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/><rect x="589" y="76" width="168" height="56" rx="14" fill="#1baf7a"/><rect x="589" y="116" width="168" height="16" fill="#1baf7a"/><text x="673.0" y="102" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Pipelining</text><text x="673.0" y="122" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">num_stages</text><text x="601" y="160" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1baf7a" font-weight="700" text-anchor="start">GAIN</text><text x="601" y="180" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">hides memory latency</text><text x="601" y="198" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">(async copies on</text><text x="601" y="216" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">Ampere and newer)</text><text x="601" y="252" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#1baf7a" font-weight="700" text-anchor="start">COST</text><text x="601" y="272" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">shared memory per</text><text x="601" y="290" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">stage, which can</text><text x="601" y="308" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">lower occupancy</text><rect x="772" y="76" width="168" height="296" rx="14" fill="#fdf4dc" stroke="#eda100" stroke-width="2"/><rect x="772" y="76" width="168" height="56" rx="14" fill="#eda100"/><rect x="772" y="116" width="168" height="16" fill="#eda100"/><text x="856.0" y="102" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Tile order</text><text x="856.0" y="122" font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#ffffff" font-weight="400" text-anchor="middle">GROUP_SIZE_M</text><text x="784" y="160" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#eda100" font-weight="700" text-anchor="start">GAIN</text><text x="784" y="180" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">better L2 cache</text><text x="784" y="198" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">reuse between</text><text x="784" y="216" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">neighbouring tiles</text><text x="784" y="252" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#eda100" font-weight="700" text-anchor="start">COST</text><text x="784" y="272" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">mostly free;</text><text x="784" y="290" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">fixed in this</text><text x="784" y="308" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#16181d" font-weight="400" text-anchor="start">study</text></svg>