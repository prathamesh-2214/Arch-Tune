<svg xmlns="http://www.w3.org/2000/svg" width="960" height="318" viewBox="0 0 960 318"><rect x="1" y="1" width="958" height="316" rx="16" fill="#ffffff" stroke="#e3e5e8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a909a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker></defs><text x="40" y="46" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#16181d" font-weight="700" text-anchor="start">Inside one compile: where registers, spills and shared memory are decided</text><rect x="40" y="92" width="132" height="92" rx="12" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/><text x="106.0" y="127.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">TTIR</text><text x="106.0" y="143.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">tile ops:</text><text x="106.0" y="160.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">load, dot, store</text><rect x="190" y="92" width="132" height="92" rx="12" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/><text x="256.0" y="127.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">TTGIR</text><text x="256.0" y="143.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">layouts, tensor cores,</text><text x="256.0" y="160.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">pipelining buffers</text><line x1="173" y1="138" x2="187" y2="138" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="340" y="92" width="132" height="92" rx="12" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/><text x="406.0" y="127.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">LLVM IR</text><text x="406.0" y="143.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">per-thread</text><text x="406.0" y="160.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">code</text><line x1="323" y1="138" x2="337" y2="138" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="490" y="92" width="132" height="92" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/><text x="556.0" y="127.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">PTX</text><text x="556.0" y="143.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">virtual ISA,</text><text x="556.0" y="160.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">unlimited registers</text><line x1="473" y1="138" x2="487" y2="138" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="92" width="132" height="92" rx="12" fill="#fdecec" stroke="#e34948" stroke-width="2"/><text x="706.0" y="127.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">ptxas</text><text x="706.0" y="143.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">allocates real</text><text x="706.0" y="160.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">registers (max 255)</text><line x1="623" y1="138" x2="637" y2="138" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="790" y="92" width="132" height="92" rx="12" fill="#e6f6f0" stroke="#1baf7a" stroke-width="2"/><text x="856.0" y="127.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">SASS</text><text x="856.0" y="143.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">machine code;</text><text x="856.0" y="160.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">spills = LDL/STL</text><line x1="773" y1="138" x2="787" y2="138" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><rect x="182" y="204" width="282" height="40" rx="8" fill="#fdf4dc" stroke="#eda100"/><text x="190" y="222" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#16181d" font-weight="400" text-anchor="start">tile sizes + warps set how many</text><text x="190" y="237" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#16181d" font-weight="400" text-anchor="start">accumulators each thread holds</text><rect x="182" y="250" width="282" height="40" rx="8" fill="#fdf4dc" stroke="#eda100"/><text x="190" y="268" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#16181d" font-weight="400" text-anchor="start">num_stages sets shared-memory</text><text x="190" y="283" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#16181d" font-weight="400" text-anchor="start">buffers + async copies</text><rect x="632" y="204" width="282" height="40" rx="8" fill="#fdecec" stroke="#e34948"/><text x="640" y="222" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#16181d" font-weight="400" text-anchor="start">spills only appear here,</text><text x="640" y="237" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#16181d" font-weight="400" text-anchor="start">after register allocation</text></svg>