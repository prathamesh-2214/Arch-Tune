="#16181d" font-weight="700" text-anchor="middle">Fastest</text><text x="856.0" y="327.0" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">same quality,</text><text x="856.0" y="343.5" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#4a4f59" font-weight="400" text-anchor="middle">fraction of time</text><line x1="774" y1="322.0" x2="786" y2="322.0" stroke="#8a909a" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="410" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4a4f59" font-weight="400" text-anchor="start">The filter removes configs that would overflow shared memory or spill registers, which are</text><text x="40" y="430" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4a4f59" font-weight="400" text-anchor="start">also the slowest ones to compile. Ranking then picks a short list; only that list is compiled and timed.</text></svg>